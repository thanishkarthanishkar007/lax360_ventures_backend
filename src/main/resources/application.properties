# ---------------------------------------------------------------------
# LAX360 Ventures backend - application configuration
# Every setting below is sourced from an environment variable at runtime.
# The value after the colon (e.g. :8080) is only a LOCAL DEVELOPMENT
# fallback and is never used once the real env var is set (e.g. on Render).
# ---------------------------------------------------------------------

spring.application.name=lax360-backend

# Render injects PORT at runtime; falls back to 8080 for local dev.
server.port=${PORT:8080}
server.address=0.0.0.0

# ---- MongoDB Atlas -----------------------------------------------------
# MONGODB_URI must be set in the environment (Render dashboard / .env).
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:lax360venture}
spring.data.mongodb.auto-index-creation=true

# ---- Resend (email notifications) --------------------------------------
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:LAX360 Ventures <onboarding@resend.dev>}
resend.notify-email=${NOTIFY_EMAIL:lax360pr.ltd@gmail.com}

# ---- CORS ---------------------------------------------------------------
# Comma-separated list of allowed frontend origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://lax360-ventures-frontend.vercel.app,http://localhost:5173,http://localhost:3000}

# ---- JWT (reserved for future authenticated endpoints) ------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Actuator / health check ---------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mongo.enabled=true

# ---- Logging --------------------------------------------------------------
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.lax360.backend=${APP_LOG_LEVEL:INFO}

# ---- Misc -------------------------------------------------------------
spring.mvc.problemdetails.enabled=true
